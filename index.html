<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wodrobe — your wardrobe, styled</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#A6491F">
<style>
:root{
  --bg:#F7F4EE; --surface:#FFFFFF; --ink:#221D16; --muted:#6E665B;
  --line:#E5DFD3; --accent:#A6491F; --accent-soft:#F3E2D7; --chip:#EFE9DD;
  --good:#3B6D11; --good-soft:#EAF3DE; --bad:#A32D2D; --bad-soft:#FCEBEB;
  --radius:14px; --serif:Georgia,'Times New Roman',serif;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#15120E; --surface:#201C16; --ink:#EDE7DC; --muted:#9A917F;
    --line:#373128; --accent:#D87A45; --accent-soft:#3A271C; --chip:#2B261F;
    --good:#9DC468; --good-soft:#26330F; --bad:#E08585; --bad-soft:#3A1A1A; }
}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
button{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.ghost{background:transparent}
input,select,textarea{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
textarea{resize:vertical;min-height:70px}
label{font-size:12px;color:var(--muted);display:block;margin:10px 0 4px}
h1{font-family:var(--serif);font-weight:500;font-size:28px}
h2{font-family:var(--serif);font-weight:500;font-size:20px;margin-bottom:12px}
h3{font-size:15px;font-weight:600}
.app{display:flex;min-height:100vh}
.side{width:212px;flex-shrink:0;border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{font-family:var(--serif);font-size:24px;letter-spacing:.5px;margin-bottom:18px;padding-left:10px}
.brand span{color:var(--accent)}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:none;background:transparent;padding:10px;border-radius:10px;color:var(--muted)}
.nav-btn svg{flex-shrink:0}
.nav-btn.active{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.side-foot{margin-top:auto;font-size:11px;color:var(--muted);padding:10px;line-height:1.5}
main{flex:1;padding:28px 32px;max-width:1060px}
.topline{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.grid{display:grid;gap:14px}
.g-stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.g-items{grid-template-columns:repeat(auto-fill,minmax(168px,1fr))}
.stat-label{font-size:12px;color:var(--muted)}
.stat-num{font-size:26px;font-family:var(--serif);margin-top:2px}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--chip);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--muted)}
.chip .dot{width:10px;height:10px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
.chip button{border:none;background:none;padding:0 0 0 2px;font-size:13px;color:var(--muted);line-height:1}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.filter-row .f{border-radius:999px;padding:6px 14px;font-size:13px}
.filter-row .f.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.item-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:transform .1s}
.item-card:hover{transform:translateY(-2px)}
.swatch{aspect-ratio:4/3.2;position:relative}
.swatch .fav{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.85);color:#A6491F;border-radius:999px;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:13px}
.item-meta{padding:10px 12px}
.item-meta .nm{font-size:13.5px;font-weight:600}
.item-meta .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.mini{font-size:11px;color:var(--muted)}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;align-items:end}
.opt-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.opt-items{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 12px}
.opt-tile{width:86px}
.opt-tile .sw{height:70px;border-radius:10px;border:1px solid var(--line)}
.opt-tile .role{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-top:5px}
.opt-tile .nm{font-size:11.5px;line-height:1.3}
.reason{font-size:13.5px;color:var(--muted);border-left:3px solid var(--accent-soft);padding-left:10px;margin:10px 0}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn-good{color:var(--good);border-color:var(--good)}
.btn-bad{color:var(--bad);border-color:var(--bad)}
.event-card{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.badge{font-size:11px;border-radius:6px;padding:2px 8px;background:var(--accent-soft);color:var(--accent)}
.overlay{position:fixed;inset:0;background:rgba(20,15,8,.45);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
.overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;width:100%;max-width:480px}
.modal h2{display:flex;justify-content:space-between;align-items:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.checks{display:flex;gap:6px;flex-wrap:wrap}
.checks label{display:inline-flex;align-items:center;gap:5px;margin:0;background:var(--chip);border-radius:999px;padding:5px 11px;font-size:12px;cursor:pointer;color:var(--ink)}
.checks input{width:auto}
.note{font-size:12px;color:var(--muted);background:var(--chip);border-radius:10px;padding:10px 12px;margin-top:14px;line-height:1.5}
.pal{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.empty{color:var(--muted);font-size:13.5px;padding:24px;text-align:center;border:1px dashed var(--line);border-radius:var(--radius)}
.section{margin-top:30px}
.up-tile{border:2px dashed var(--line);border-radius:var(--radius);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);cursor:pointer;min-height:180px;font-size:13px;background:transparent;padding:10px;text-align:center}
.up-tile:hover{border-color:var(--accent);color:var(--accent)}
.up-tile .plus{font-size:30px;line-height:1;font-family:var(--serif)}
.steps{display:flex;gap:6px;margin:8px 0 16px}
.steps .s{flex:1;height:4px;border-radius:99px;background:var(--chip)}
.steps .s.on{background:var(--accent)}
.photo-btn{display:flex;align-items:center;justify-content:center;gap:8px;border:2px dashed var(--line);border-radius:12px;padding:14px;width:100%;cursor:pointer;color:var(--muted);background:transparent}
.photo-btn:hover{border-color:var(--accent);color:var(--accent)}
.photo-btn img{max-height:96px;border-radius:8px}
.rev-img{width:100%;max-height:210px;object-fit:cover;border-radius:10px;margin:8px 0}
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;font-size:11px;color:var(--muted);text-align:center;margin-bottom:6px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-cell{aspect-ratio:1;border:1px solid var(--line);border-radius:10px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;cursor:pointer;padding:0}
.cal-cell.today{border:2px solid var(--accent)}
.cal-cell.logged{background:var(--accent-soft)}
.cal-dots{display:flex;gap:3px}
.cal-dots i{width:7px;height:7px;border-radius:50%;display:block;border:1px solid rgba(0,0,0,.15)}
.bar{height:6px;background:var(--chip);border-radius:99px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.item-card .swatch svg{transition:transform .28s ease}
.item-card:hover .swatch svg{transform:rotate(-3deg) translateY(-3px) scale(1.05)}
.fit-wrap{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:14px;align-items:start}
@media(max-width:880px){.fit-wrap{grid-template-columns:1fr}}
.avatar-card svg{width:100%;max-height:480px;display:block;margin:auto}
.av-br{animation:breathe 4.2s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-3.5px)}}
.fit-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.fit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px}
.fit-tile{aspect-ratio:1;border:1.5px solid var(--line);border-radius:12px;background:var(--chip);padding:4px;cursor:pointer;display:flex}
.fit-tile:hover{border-color:var(--muted)}
.fit-tile.on{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent)}
.fit-tile svg{transition:transform .25s ease}
.fit-tile:hover svg{transform:rotate(-4deg) scale(1.07)}
@media (max-width:760px){
  .app{flex-direction:column}
  .side{width:100%;height:auto;position:static;flex-direction:row;align-items:center;overflow-x:auto;padding:10px 12px;border-right:none;border-bottom:1px solid var(--line)}
  .brand{margin:0 10px 0 0;font-size:20px}
  .nav-btn{width:auto;white-space:nowrap;padding:8px 10px}
  .nav-btn .lbl{display:none}
  .side-foot{display:none}
  main{padding:18px 14px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">wo<span>drobe</span></div>
    <button class="nav-btn" data-act="nav" data-v="dashboard">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>
      <span class="lbl">Dashboard</span></button>

  <main id="main"></main>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>

<script>
"use strict";
const LS_KEY = "wodrobe_v1";
const NEUTRALS = ["white","off-white","cream","black","charcoal","grey","gray","navy","tan","beige","brown","camel","indigo","denim","stone","khaki"];
const OCCS = ["work","casual","date","formal","sport","travel","lounge"];
const SEASONS = ["spring","summer","fall","winter"];
const OCC_FORMALITY = {work:[3,4], casual:[1,2], date:[2,4], formal:[4,5], travel:[1,3], sport:[1,2], lounge:[1,1]};

function seedData(){
  return {
    garments: [],
    outfits: [],
    rejected: [],
    wearLog: [],
    trips: {},
    events: [],
    onboarded: false,
    profile: {
      name:"You", undertone:"neutral", depth:"medium", season:"Soft summer", jewelry:"both",
      bodyType:"rectangle", skinHex:null, hair:"brown",
      bestColors:[{name:"dusty rose",hex:"#C49AA0"},{name:"sage",hex:"#9AA98C"},{name:"slate",hex:"#6E7B8C"},{name:"mauve",hex:"#9A7E9E"},{name:"soft navy",hex:"#3A4A66"},{name:"stone",hex:"#B8AFA0"}],
      avoidColors:[{name:"neon green",hex:"#39FF14"},{name:"orange",hex:"#D2722A"}],
      stylePrefs:["smart casual"],
      learned:"Nothing yet — outfit feedback will build this profile."
    }
  };
}
function demoData(){
  const g = (id,name,cat,colors,pattern,formality,warmth,seasons,occasions,extra)=>Object.assign(
    {id,name,cat,colors,pattern,formality,warmth,seasons,occasions,fav:false,worn:0,score:0,status:"active",img:null,rain:false,price:null,lastWorn:null,condition:"good",care:""}, extra||{});
  const all = SEASONS.slice();
  const garments = [
    g("g01","White tee","top",[{name:"white",hex:"#F2EFE6"}],"solid",1,1,["spring","summer"],["casual","sport","lounge"],{worn:24}),
    g("g02","Breton stripe tee","top",[{name:"cream",hex:"#EFE8D8"},{name:"navy",hex:"#1F2A44"}],"stripe",2,1,["spring","summer"],["casual","travel","date"]),
    g("g03","Rust linen shirt","top",[{name:"rust",hex:"#B7410E"}],"solid",2,1,["summer","spring"],["casual","date","travel"],{fav:true,worn:9}),
    g("g04","White oxford shirt","top",[{name:"white",hex:"#F6F3EC"}],"solid",4,2,all,["work","formal","date"],{worn:17}),
    g("g05","Navy merino crewneck","top",[{name:"navy",hex:"#1F2A44"}],"solid",3,3,["fall","winter","spring"],["work","casual","date"],{fav:true,worn:31}),
    g("g06","Forest chunky knit","top",[{name:"forest",hex:"#2F4A35"}],"texture",2,4,["fall","winter"],["casual","date"],{worn:6}),
    g("g07","Grey hoodie","top",[{name:"grey",hex:"#8A8A85"}],"solid",1,3,["fall","winter","spring"],["casual","sport","lounge"],{worn:22}),
    g("g08","Dark indigo jeans","bottom",[{name:"indigo",hex:"#2B3A55"}],"solid",2,3,all,["casual","date","travel"],{worn:40}),
    g("g09","Beige chinos","bottom",[{name:"beige",hex:"#C9B18C"}],"solid",3,2,["spring","summer","fall"],["work","casual","date"],{worn:14}),
    g("g10","Charcoal wool trousers","bottom",[{name:"charcoal",hex:"#3B3B3B"}],"solid",4,3,["fall","winter"],["work","formal"],{worn:11}),
    g("g11","Olive ripstop pants","bottom",[{name:"olive",hex:"#5A6242"}],"solid",2,2,["spring","summer","fall"],["casual","travel","sport"],{worn:8}),
    g("g12","White leather sneakers","footwear",[{name:"white",hex:"#F1EEE7"}],"solid",2,2,all,["casual","travel","work","sport"],{worn:35}),
    g("g13","Brown chelsea boots","footwear",[{name:"brown",hex:"#5C4033"}],"solid",3,3,["fall","winter","spring"],["work","casual","date"],{fav:true,worn:28}),
    g("g14","Black derby shoes","footwear",[{name:"black",hex:"#1C1A18"}],"solid",5,2,all,["formal","work"],{worn:5}),
    g("g15","Charcoal blazer","outerwear",[{name:"charcoal",hex:"#3F3D3B"}],"solid",4,2,all,["work","formal","date"],{worn:10}),
    g("g16","Olive field jacket","outerwear",[{name:"olive",hex:"#56603F"}],"solid",2,3,["spring","fall"],["casual","travel"],{worn:13}),
    g("g17","Camel overcoat","outerwear",[{name:"camel",hex:"#B98A4A"}],"solid",4,5,["winter"],["work","formal","date"],{fav:true,worn:7,price:220}),
    g("g18","Navy raincoat","outerwear",[{name:"navy",hex:"#23304C"}],"solid",2,3,["spring","fall"],["casual","travel","work"],{rain:true,worn:9,price:95}),
    g("g19","Black wrap dress","dress",[{name:"black",hex:"#211F1D"}],"solid",4,2,all,["date","formal","work"],{worn:4,price:90}),
    g("g20","Floral midi dress","dress",[{name:"cream",hex:"#EFE4CC"},{name:"rust",hex:"#B7410E"}],"floral",3,1,["spring","summer"],["date","casual"],{worn:3,price:65}),
    g("g21","Denim midi skirt","bottom",[{name:"denim",hex:"#3A4C6B"}],"solid",2,2,["spring","summer"],["casual","date"],{worn:5,price:40}),
    g("g22","Tan leather belt","accessory",[{name:"tan",hex:"#B89B72"}],"solid",3,1,all,["work","casual","date","formal"],{worn:30,price:35}),
    g("g23","Camel wool scarf","accessory",[{name:"camel",hex:"#B98A4A"}],"texture",3,4,["winter"],["work","casual","date"],{worn:6,price:30}),
  ];
  const prices = {g01:15,g02:25,g03:45,g04:60,g05:95,g06:70,g07:35,g08:80,g09:50,g10:90,g11:55,g12:85,g13:140,g14:110,g15:130,g16:75};
  garments.forEach(it=>{ if(it.price==null && prices[it.id]) it.price = prices[it.id]; });
  const d = n => { const t=new Date(); t.setDate(t.getDate()+n); return t.toISOString().slice(0,10); };
  return {
    garments,
    events: [
      {id:"e1", title:"Sara's wedding", type:"formal", date:d(21), end:null, dressCode:"cocktail", location:"Lakeside pavilion",
        notes:"Outdoor ceremony at 4pm, cocktail dress code. Dinner reception after, then party until late."},
      {id:"e2", title:"Lisbon trip", type:"travel", date:d(30), end:d(34), dressCode:"", location:"Lisbon",
        notes:"Day 1: arrive, walk the old town, dinner by the river. Day 2: beach morning, museum after, night out in Bairro Alto. Day 3: client meeting, then casual dinner. Day 4: hike to the viewpoint, flight home."},
    ]
  };
}
function loadDemo(){
  const demo = demoData();
  db.garments = demo.garments;
  db.events = demo.events;
  save(); render();
}

let db;
try { db = JSON.parse(localStorage.getItem(LS_KEY)) || seedData(); }
catch(e){ db = seedData(); }
db.wearLog = db.wearLog || [];
db.trips = db.trips || {};
db.settings = Object.assign({apiKey:"", model:"claude-opus-4-8", lat:null, lon:null}, db.settings||{});
db.presets = db.presets || [];
db.wishlist = db.wishlist || [];
db.pairs = db.pairs || {};
db.chat = db.chat || [];
db.fit = db.fit || {};
db.garments.forEach(g=>{ if(!g.condition) g.condition="good"; if(g.care==null) g.care=""; });
if(db.profile){ if(db.profile.skinHex===undefined) db.profile.skinHex=null; if(!db.profile.hair) db.profile.hair="brown"; }
const save = () => localStorage.setItem(LS_KEY, JSON.stringify(db));
const uid = () => Math.random().toString(36).slice(2,9);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
const fmtDate = iso => new Date(iso+"T12:00").toLocaleDateString(undefined,{month:"short",day:"numeric"});
const isoOf = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

/* ---------- on-device photo heuristics (Claude vision in production) ---------- */
const NAMED_COLORS = [["white","#F2EFE6"],["cream","#EFE4CC"],["beige","#C9B18C"],["tan","#B89B72"],["camel","#B98A4A"],["mustard","#C99A2E"],["yellow","#E3C53A"],["orange","#D2722A"],["rust","#B7410E"],["red","#B3322E"],["burgundy","#6E2230"],["pink","#D88FA5"],["purple","#6E4F8E"],["navy","#1F2A44"],["blue","#3A6EA5"],["light blue","#8FB3D1"],["teal","#2E6E6A"],["forest","#2F4A35"],["olive","#5A6242"],["green","#5C8A4E"],["brown","#5C4033"],["chocolate","#4A2F23"],["charcoal","#3B3B3B"],["grey","#8A8A85"],["black","#1E1C1A"],["denim","#2B3A55"],["stone","#B8AFA0"]];
const hex2rgb = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
const rgb2hex = (r,g,b) => "#"+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,"0")).join("");
function nearestColorName(hex){
  const [r,g,b] = hex2rgb(hex); let best="grey", bd=1e9;
  for(const [n,h] of NAMED_COLORS){ const [r2,g2,b2]=hex2rgb(h);
    const d=(r-r2)**2+(g-g2)**2+(b-b2)**2; if(d<bd){bd=d;best=n;} }
  return best;
}
function dominantColor(dataUrl){
  return new Promise(res=>{
    const img = new Image();
    img.onload = ()=>{
      try{
        const s=56, c=document.createElement("canvas"); c.width=s; c.height=s;
        const x=c.getContext("2d"); x.drawImage(img,0,0,s,s);
        const m=Math.floor(s*0.2), w=Math.floor(s*0.6);
        const d=x.getImageData(m,m,w,w).data, buckets={};
        for(let i=0;i<d.length;i+=4){
          if(d[i+3]<200) continue;
          const k=(d[i]>>5)+","+(d[i+1]>>5)+","+(d[i+2]>>5);
          const u=buckets[k]=buckets[k]||[0,0,0,0];
          u[0]+=d[i]; u[1]+=d[i+1]; u[2]+=d[i+2]; u[3]++;
        }
        let best=null;
        for(const k in buckets) if(!best||buckets[k][3]>best[3]) best=buckets[k];
        res(best? rgb2hex(best[0]/best[3],best[1]/best[3],best[2]/best[3]) : "#888888");
      }catch(e){ res("#888888"); }
    };
    img.onerror = ()=>res("#888888");
    img.src = dataUrl;
  });
}
function sampleSkin(dataUrl){
  return new Promise(res=>{
    const img = new Image();
    img.onload = ()=>{
      try{
        const s=80, c=document.createElement("canvas"); c.width=s; c.height=s;
        const x=c.getContext("2d"); x.drawImage(img,0,0,s,s);
        const d=x.getImageData(Math.floor(s*0.3),Math.floor(s*0.25),Math.floor(s*0.4),Math.floor(s*0.4)).data;
        let r=0,g=0,b=0,n=0;
        for(let i=0;i<d.length;i+=4){
          const R=d[i],G=d[i+1],B=d[i+2];
          if(R>G && G>B*0.8 && R>60 && R-B>8){ r+=R; g+=G; b+=B; n++; }
        }
        if(n<20){ res(null); return; }
        r/=n; g/=n; b/=n;
        const Y=0.2126*r+0.7152*g+0.0722*b;
        const depth = Y>190?"fair":Y>165?"light":Y>135?"medium":Y>105?"medium-deep":"deep";
        const diff = r-b;
        const undertone = diff>62?"warm":diff<38?"cool":"neutral";
        res({hex:rgb2hex(r,g,b), depth, undertone});
      }catch(e){ res(null); }
    };
    img.onerror = ()=>res(null);
    img.src = dataUrl;
  });
}

function imgBlock(dataUrl){

async function claude(messages, opts){
  opts = opts||{};
  const r = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{
      "x-api-key": aiKey(),
      "anthropic-version":"2023-06-01",
      "anthropic-dangerous-direct-browser-access":"true",
      "content-type":"application/json"
    },
    body: JSON.stringify({ model: db.settings.model||"claude-opus-4-8", max_tokens: opts.maxTokens||1500,
      system: opts.system||undefined, messages })
  });
  if(!r.ok){ const t = await r.text(); throw new Error("Claude "+r.status+": "+t.slice(0,140)); }
  const data = await r.json();
  return data.content.filter(b=>b.type==="text").map(b=>b.text).join("");
}

const pairKey = (a,b) => a<b ? a+"|"+b : b+"|"+a;
function updatePairs(ids, delta){
  for(let i=0;i<ids.length;i++) for(let j=i+1;j<ids.length;j++){
    const k = pairKey(ids[i],ids[j]);
    db.pairs[k] = Math.max(-4, Math.min(6, (db.pairs[k]||0)+delta));
  }
}
function currentSeason(){
  const m = new Date().getMonth();
  return m<2||m===11 ? "winter" : m<5 ? "spring" : m<8 ? "summer" : "fall";
}
const WMO = c => c===0?"clear":c<=3?"partly cloudy":c<=48?"foggy":c<=67?"rainy":c<=77?"snowy":c<=82?"showers":"stormy";
async function fetchWeather(){
  const s = db.settings; if(s.lat==null) return null;
  const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${s.lat}&longitude=${s.lon}&current=temperature_2m,weather_code&daily=temperature_2m_max,precipitation_probability_max&forecast_days=1&timezone=auto`);
  if(!r.ok) throw new Error("weather "+r.status);
  const w = await r.json();
  state.weather = { temp: Math.round(w.current.temperature_2m), label: WMO(w.current.weather_code),
    high: Math.round(w.daily.temperature_2m_max[0]),
    rain: (w.daily.precipitation_probability_max[0]||0) >= 45 };
  state.temp = state.weather.temp; state.rain = state.weather.rain;
  return state.weather;
}
function enableWeather(){
  if(!navigator.geolocation){ alert("Geolocation unavailable in this browser."); return; }
  navigator.geolocation.getCurrentPosition(async pos=>{
    db.settings.lat = +pos.coords.latitude.toFixed(3);
    db.settings.lon = +pos.coords.longitude.toFixed(3);
    save();
    try{ await fetchWeather(); }catch(e){}
    render();
  }, ()=>alert("Couldn't get your location."));
}
async function weatherForTrip(locName, dates){
  try{
    if(!locName || !dates.length) return null;
    const horizon = isoOf(new Date(Date.now()+15*86400000));
    if(dates[0] > horizon) return null;
    const g = await (await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(locName)}&count=1`)).json();
    if(!g.results || !g.results.length) return null;
    const last = dates[dates.length-1] <= horizon ? dates[dates.length-1] : horizon;
    const f = await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${g.results[0].latitude}&longitude=${g.results[0].longitude}&daily=temperature_2m_max,precipitation_probability_max&start_date=${dates[0]}&end_date=${last}&timezone=auto`)).json();
    const map = {};
    (f.daily.time||[]).forEach((d,i)=>{ map[d] = {temp:Math.round(f.daily.temperature_2m_max[i]), rain:(f.daily.precipitation_probability_max[i]||0)>=45}; });
    return map;
  }catch(e){ return null; }
}
function wrapText(x, text, bx, by, maxW, lh){
  const words = String(text).split(" "); let line = "", yy = by;
  for(const w of words){
    if(x.measureText(line+w).width > maxW && line){ x.fillText(line.trim(), bx, yy); line = w+" "; yy += lh; }
    else line += w+" ";
  }
  x.fillText(line.trim(), bx, yy);
}
function shareOutfit(ids, title){
  const items = ids.map(id=>db.garments.find(g=>g.id===id)).filter(Boolean);
  if(!items.length) return;
  const c = document.createElement("canvas"); c.width = 900; c.height = 520;
  const x = c.getContext("2d");
  x.fillStyle = "#F7F4EE"; x.fillRect(0,0,900,520);
  x.fillStyle = "#221D16"; x.font = "500 38px Georgia, serif"; x.fillText(title, 48, 84);
  x.font = "15px system-ui"; x.fillStyle = "#6E665B";
  x.fillText(new Date().toLocaleDateString(undefined,{month:"long",day:"numeric",year:"numeric"}), 48, 114);
  const n = items.length, bw = Math.min(180, (900-96-(n-1)*20)/n);
  items.forEach((g,i)=>{
    const bx = 48 + i*(bw+20);
    x.fillStyle = g.colors[0] ? g.colors[0].hex : "#999";
    x.beginPath(); x.roundRect(bx, 150, bw, 200, 16); x.fill();
    if(g.colors[1]){ x.fillStyle = g.colors[1].hex; x.beginPath(); x.roundRect(bx, 310, bw, 40, [0,0,16,16]); x.fill(); }
    x.fillStyle = "#221D16"; x.font = "600 15px system-ui";
    wrapText(x, g.name, bx, 380, bw, 19);
    x.fillStyle = "#6E665B"; x.font = "12px system-ui"; x.fillText(g.cat, bx, 436);
  });
  x.fillStyle = "#A6491F"; x.font = "500 26px Georgia, serif"; x.fillText("wodrobe", 48, 486);
  c.toBlob(b=>{
    const a = document.createElement("a"); a.href = URL.createObjectURL(b);
    a.download = String(title).replace(/[^a-z0-9]+/gi,"-").toLowerCase()+".png";
    a.click(); URL.revokeObjectURL(a.href);
  }, "image/png");
}

function swatchDiv(g, cls, inner=""){
  return `<div class="${cls}" style="background:var(--chip);display:flex">${garmentArt(g)}${inner}</div>`;
}
function itemCard(g){
  return `<div class="item-card" data-act="open-garment" data-id="${g.id}">

}
function tile(g, role){
  return `<div class="opt-tile">${swatchDiv(g, "sw")}
    <div class="role">${esc(role)}</div><div class="nm">${esc(g.name)}</div></div>`;
}
function colorChip(c, act, idx){
  return `<span class="chip"><span class="dot" style="background:${c.hex}"></span>${esc(c.name)}${act?`<button data-act="${act}" data-i="${idx}">&times;</button>`:""}</span>`;
}

/* ---------- views ---------- */
function wardrobeGaps(){
  const a = db.garments.filter(g=>g.status==="active");
  const gaps = [];
  if(!a.some(g=>g.rain)) gaps.push("a rain layer");
  if(!a.some(g=>g.cat==="outerwear" && g.warmth>=4)) gaps.push("a proper winter coat");
  if(!a.some(g=>g.cat==="footwear" && g.formality>=4)) gaps.push("formal shoes");
  if(!a.some(g=>(g.cat==="top"||g.cat==="dress") && g.formality>=4)) gaps.push("a formal top or dress");
  if(!a.some(g=>(g.cat==="top"||g.cat==="dress") && g.warmth===1)) gaps.push("lightweight summer pieces");
  if(a.filter(g=>g.occasions.includes("sport")).length<2) gaps.push("activewear");
  return gaps;
}
function startSteps(){
  const items = db.garments.filter(g=>g.status==="active").length;
  return [
    {ok: !!(db.profile && db.profile.season), label:"Run your color &amp; body analysis", act:"wiz-start", btn:"Run"},
    {ok: items>=8, label:"Build your wardrobe (8+ items)", act:"add-garment", btn:"Add"},
    {ok: db.outfits.length>0 || db.wearLog.length>0, label:"Save your first look", act:"nav", v:"dress", btn:"Dress me"},
  ];
}
function logStreak(){
  const dates = new Set(db.wearLog.map(l=>l.date));
  let n = 0, d = new Date();
  if(!dates.has(isoOf(d))) d = new Date(d.getTime()-86400000);
  while(dates.has(isoOf(d))){ n++; d = new Date(d.getTime()-86400000); }
  return n;
}
function todaysPick(){
  const day = new Date().getDay();
  const occ = (day===0||day===6) ? "casual" : "work";
  const {combos} = buildCombos(occ, state.temp, state.rain, null, "all");
  return combos.length ? {occ, items:combos[0].items} : null;
}

/* ---------- outfit generator (mock of /api/outfits/generate) ---------- */
const targetWarmth = t => t>=25?1 : t>=18?2 : t>=10?3 : t>=3?4 : 5;
function accentsOf(items){
  const set = new Set();
  items.forEach(g=>g.colors.forEach(c=>{ if(!NEUTRALS.includes(c.name.toLowerCase())) set.add(c.name.toLowerCase()); }));
  return [...set];
}
function scoreCombo(items, target, frange, rain){
  const fmid = (frange[0]+frange[1])/2;
  let sc = 0;
  for(const g of items){
    sc += (g.score||0) + (g.fav?1.5:0) + Math.min(g.worn||0,30)/30;
    if(g.cat!=="accessory") sc -= Math.abs(g.warmth-target)*0.8;
    sc -= Math.abs(g.formality-fmid)*0.7;
  }
  const acc = accentsOf(items);
  if(acc.length===0) sc += 1.5;
  else if(acc.length===1) sc += 2.5;
  else if(acc.length===2) sc += 0.5;
  else sc -= 2;
  for(const a of acc){
    if(db.profile.bestColors.some(c=>c.name.toLowerCase()===a)) sc += 1.4;
    if(db.profile.avoidColors.some(c=>c.name.toLowerCase()===a)) sc -= 2.5;
  }
  if(rain && items.some(g=>g.rain)) sc += 1.5;
  for(let i=0;i<items.length;i++) for(let j=i+1;j<items.length;j++)
    sc += (db.pairs[pairKey(items[i].id, items[j].id)]||0)*0.4;
  return sc;
}
function comboHash(items){ return items.map(g=>g.id).sort().join("|"); }
function buildReason(items, occ, temp, target, rain){
  const anchor = items.slice().sort((a,b)=>((b.fav?20:0)+(b.worn||0))-((a.fav?20:0)+(a.worn||0)))[0];
  const acc = accentsOf(items);
  const bits = [];
  bits.push(`Built around your ${anchor.name.toLowerCase()}${anchor.fav?" — a favorite":""}${anchor.worn>=20?` you've worn ${anchor.worn} times`:""}.`);
  if(acc.length===0) bits.push("Fully neutral palette, so the silhouette does the talking.");
  else if(acc.length===1){
    const inPal = db.profile.bestColors.some(c=>c.name.toLowerCase()===acc[0]);
    bits.push(`One accent — ${acc[0]} — ${inPal?`squarely in your ${db.profile.season.toLowerCase()} palette`:"kept away from the face"}; the rest stays neutral.`);
  } else bits.push(`Two accents (${acc.join(", ")}) balanced with neutrals.`);
  bits.push(`Warmth sits near ${target}/5 for ${temp}°C${rain?", and the rain layer keeps you dry":""}; formality reads right for ${occ}.`);
  return bits.join(" ");
}
function buildCombos(occ, temp, rain, boostSet, scope){
  const target = targetWarmth(temp);
  const fr = OCC_FORMALITY[occ] || [1,5];
  let scopeIds = null;
  if(scope==="favorites") scopeIds = new Set(db.garments.filter(g=>g.fav).map(g=>g.id));
  else if(scope && scope.startsWith("trip:")){
    const t = db.trips[scope.slice(5)];
    if(t) scopeIds = new Set(t.packing || t.items || []);
  }
  const inScope = g => !scopeIds || scopeIds.has(g.id);
  const pool = db.garments.filter(g => g.status==="active" && inScope(g) && g.occasions.includes(occ)
    && g.formality >= fr[0]-1 && g.formality <= fr[1]);
  const within = g => Math.abs(g.warmth-target)<=2;
  const tops = pool.filter(g=>g.cat==="top" && within(g));
  const bottoms = pool.filter(g=>g.cat==="bottom" && within(g));
  const dresses = pool.filter(g=>g.cat==="dress" && within(g));
  const shoes = pool.filter(g=>g.cat==="footwear");
  const accs = pool.filter(g=>g.cat==="accessory" && (g.warmth<=2 || target>=4));
  const outers = db.garments.filter(g => g.status==="active" && inScope(g) && g.cat==="outerwear"
    && g.occasions.includes(occ) && g.formality >= fr[0]-1 && target>=3 && g.warmth >= target-1);
  const score = items => {
    let sc = scoreCombo(items, target, fr, rain);
    if(boostSet) for(const it of items) if(boostSet.has(it.id)) sc += 1.2;
    return sc;
  };
  const combos = [];
  const push = base => {
    let items = base, best = score(base);
    if(outers.length){
      for(const o of outers){
        const sc2 = score(base.concat(o));
        if(sc2 > best){ best = sc2; items = base.concat(o); }
      }
      if(target>=4 && items.length===base.length){
        let bo=null, bs=-1e9;
        for(const o of outers){ const sc2 = score(base.concat(o)); if(sc2>bs){bs=sc2;bo=o;} }
        if(bo){ items = base.concat(bo); best = bs; }
      }
    }
    if(accs.length){
      let ba=null, bs2=-1e9;
      for(const a of accs){ const s2 = score(items.concat(a)); if(s2>bs2){bs2=s2;ba=a;} }
      if(ba && bs2 > best - 0.3){ items = items.concat(ba); best = bs2; }
    }
    const hash = comboHash(items);
    if(db.rejected.includes(hash)) return;
    combos.push({items, score:best, hash});
  };
  for(const t of tops) for(const b of bottoms) for(const s of shoes) push([t,b,s]);
  for(const d of dresses) for(const s of shoes) push([d,s]);
  combos.sort((a,b)=>b.score-a.score);
  return {combos, target, fr};
}
async function generate(){
  state.aiError = null;
  if(aiKey()){
    try{ await generateAI(); return; }
    catch(e){ state.aiError = e.message; }
  }
  generateLocal();
}
async function generateAI(){
  const occ = state.occ, temp = state.temp, rain = state.rain;
  const prompt = `WARDROBE CATALOG (JSON):\n${catalogJson()}\n\nUSER PROFILE: ${profileBrief()}\n\nCONTEXT: occasion=${occ}; temperature=${temp}C; rain=${rain}; scope=${state.scope}.\nNever repeat these rejected id-sets exactly: ${db.rejected.join(" ; ")||"none"}.\n\nPropose 3 distinct, complete outfits using ONLY ids from the catalog (include footwear; layer outerwear/accessories when sensible). Reply ONLY JSON: {"outfits":[{"title":"short title","item_ids":["..."],"reason":"2-3 sentences referencing the weather, occasion and the user's coloring/style"}]}`;
  const text = await claude([{role:"user", content:prompt}], {maxTokens:1400, system:"You are a personal stylist. Reply only with JSON."});
  const data = extractJson(text);
  const opts = [];
  (data.outfits||[]).slice(0,3).forEach((o,i)=>{
    const items = (o.item_ids||[]).map(id=>db.garments.find(g=>g.id===id && g.status==="active")).filter(Boolean);
    if(items.length < 2) return;
    const roles = {}; items.forEach(g=>roles[g.id] = g.cat==="outerwear"?"layer":g.cat);
    const colors = []; const seen = new Set();
    items.forEach(g=>g.colors.forEach(c=>{ if(!seen.has(c.name)){seen.add(c.name); colors.push(c);} }));
    opts.push({ items:items.map(g=>g.id), roles, hash:comboHash(items),
      title:(o.title||`Option ${i+1}`), reason:o.reason||"", colors, occ, temp });
  });
  if(!opts.length) throw new Error("no valid outfits in AI reply");
  state.options = opts;
}
function generateLocal(){
  const occ = state.occ, temp = state.temp, rain = state.rain;
  let {combos} = buildCombos(occ, temp, rain, null, state.scope);
  if(!combos.length && state.scope!=="all") ({combos} = buildCombos(occ, temp, rain, null, "all"));
  const picked = [], usedAnchors = new Set(), usedHash = new Set();
  for(const c of combos){
    const anchor = c.items.find(g=>g.cat==="top"||g.cat==="dress");
    const aid = anchor ? anchor.id : c.items[0].id;
    if(usedHash.has(c.hash) || usedAnchors.has(aid)) continue;
    usedAnchors.add(aid); usedHash.add(c.hash); picked.push(c);
    if(picked.length===3) break;
  }
  state.options = picked.map((c,i)=>{
    const acc = accentsOf(c.items);
    const roles = {}; c.items.forEach(g=>roles[g.id] = g.cat==="outerwear"?"layer":g.cat);
    const colors = []; const seen = new Set();
    c.items.forEach(g=>g.colors.forEach(col=>{ if(!seen.has(col.name)){ seen.add(col.name); colors.push(col);} }));
    return { items:c.items.map(g=>g.id), roles, hash:c.hash,
      title: `${acc.length? cap(acc[0]) : "Neutral"} ${occ} — option ${i+1}`,
      reason: buildReason(c.items, occ, temp, targetWarmth(temp), rain),
      colors, occ, temp };
  });
}

function cropZone(img, sx, sy, sw, sh){
  const c = document.createElement("canvas");
  const scale = Math.min(1, 480/sw);
  c.width = Math.max(1, Math.round(sw*scale)); c.height = Math.max(1, Math.round(sh*scale));
  c.getContext("2d").drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", 0.85);
}
function extractPieces(dataUrl){
  return new Promise(res=>{
    const img = new Image();
    img.onload = ()=>{
      try{
        const W = img.naturalWidth, H = img.naturalHeight;
        const zones = [
          {cat:"top",      sx:0.18, sy:0.10, sw:0.64, sh:0.38},
          {cat:"bottom",   sx:0.22, sy:0.45, sw:0.56, sh:0.36},
          {cat:"footwear", sx:0.20, sy:0.80, sw:0.60, sh:0.20},
        ];
        res(zones.map(z=>({
          img: cropZone(img, Math.round(z.sx*W), Math.round(z.sy*H), Math.round(z.sw*W), Math.round(z.sh*H)),
          cat: z.cat, hint: "extracted"
        })));
      }catch(e){ res([{img:dataUrl, cat:null, hint:null}]); }
    };
    img.onerror = ()=>res([{img:dataUrl, cat:null, hint:null}]);
    img.src = dataUrl;
  });
}
async function startQueue(mode){

  }

}
function cropRel(dataUrl, b){
  return new Promise(res=>{
    const img = new Image();
    img.onload = ()=>{
      const W = img.naturalWidth, H = img.naturalHeight;
      const sx = Math.max(0, b.x*W), sy = Math.max(0, b.y*H);
      const sw = Math.max(10, Math.min(W-sx, b.w*W)), sh = Math.max(10, Math.min(H-sy, b.h*H));
      res(cropZone(img, sx, sy, sw, sh));
    };
    img.onerror = ()=>res(dataUrl);
    img.src = dataUrl;
  });
}
async function extractWithAI(dataUrl){
  const prompt = `Detect every distinct clothing item visible in this photo (top/shirt, bottom/pants, dress, outerwear, footwear, accessory). Reply ONLY JSON: {"garments":[{"category":"top|bottom|dress|outerwear|footwear|accessory","bbox":{"x":0.0,"y":0.0,"w":0.0,"h":0.0}}]} where bbox is normalized 0-1 coordinates of that garment's region.`;
  const text = await claude([{role:"user", content:[imgBlock(dataUrl), {type:"text", text:prompt}]}], {maxTokens:700});
  const d = extractJson(text);
  const list = (d.garments||[]).filter(g=>g.bbox && g.bbox.w>0 && g.bbox.h>0).slice(0,6);
  if(!list.length) throw new Error("no garments detected");
  const crops = await Promise.all(list.map(g=>cropRel(dataUrl, g.bbox)));
  return crops.map((img,i)=>({img, cat:list[i].category||null, hint:"extracted"}));
}
async function tagWithAI(item){
  const prompt = `Analyze this clothing item photo for a wardrobe catalog. Reply ONLY JSON: {"name":"short name like 'Navy merino crewneck'","category":"top|bottom|dress|outerwear|footwear|accessory","color_name":"one lowercase word","color_hex":"#RRGGBB sampled from the garment","pattern":"solid|stripe|floral|texture","formality":1,"warmth":1,"seasons":["spring"],"occasions":["casual"]} (formality & warmth 1-5; seasons from spring/summer/fall/winter; occasions from work/casual/date/formal/sport/travel/lounge).`;
  const text = await claude([{role:"user", content:[imgBlock(item.img), {type:"text", text:prompt}]}], {maxTokens:500});
  const d = extractJson(text);
  return {
    name: d.name||"New item", cat: item.cat||d.category||"top",
    colorName: d.color_name||"color",
    colorHex: /^#[0-9a-fA-F]{6}$/.test(d.color_hex||"") ? d.color_hex : "#888888",
    pattern: ["solid","stripe","floral","texture"].includes(d.pattern)? d.pattern : "solid",
    formality: Math.min(5, Math.max(1, +d.formality||2)),
    warmth: Math.min(5, Math.max(1, +d.warmth||2)),
    seasons: (d.seasons||[]).filter(s=>SEASONS.includes(s)),
    occasions: (d.occasions||[]).filter(o=>OCCS.includes(o)),
    source: "ai"
  };
}

async function skinWithAI(dataUrl){
  const prompt = `Seasonal color analysis from this photo. Judge undertone from jawline/neck relative to the sclera; lower confidence if lighting is tinted, filtered or overexposed. Reply ONLY JSON: {"undertone":"warm|cool|neutral|olive","depth":"fair|light|medium|medium-deep|deep","season":"e.g. warm autumn","jewelry":"gold|silver|both","confidence":"low|medium|high","best_colors":[{"name":"...","hex":"#RRGGBB"}],"avoid_colors":[{"name":"...","hex":"#RRGGBB"}],"caveats":"one sentence"} with 8-12 best colors and 2-5 avoid colors.`;
  const text = await claude([{role:"user", content:[imgBlock(dataUrl), {type:"text", text:prompt}]}], {maxTokens:900});
  return extractJson(text);
}

function wizNext(){
  const w = state.wiz; if(!w) return;
  if(w.step===2){
    ["veins","jewelry","sun","frame","waist"].forEach(n=>{
      const el = document.querySelector(`input[name="q_${n}"]:checked`); if(el) w.answers[n]=el.value; });
    ["hair","eyes"].forEach(n=>{ const el = document.getElementById("q_"+n); if(el) w.answers[n]=el.value; });
  }
  w.step = Math.min(3, w.step+1); wizRender();
}
function wizCompute(){
  const w = state.wiz, a = w.answers;
  const bodyTypeFromAnswers = a.frame==="shoulders"?"inverted triangle": a.frame==="hips"?"pear": a.waist==="defined"?"hourglass":"rectangle";
  if(w.ai){
    const r2 = w.ai;
    return { undertone: r2.undertone||"neutral", depth: r2.depth||"medium",
      season: String(r2.season||"soft summer").toLowerCase(), bodyType: bodyTypeFromAnswers,
      jewelry: r2.jewelry||"both", confidence: (r2.confidence||"medium")+" (Claude vision)",
      palette: { best:(r2.best_colors||[]).map(c=>[c.name, c.hex]), avoid:(r2.avoid_colors||[]).map(c=>[c.name, c.hex]) },
      caveats: r2.caveats||"" };
  }
  const votes = {warm:0, cool:0, neutral:0};
  const map = { veins:{green:"warm",blue:"cool",unsure:"neutral"},
                jewelry:{gold:"warm",silver:"cool",both:"neutral"},
                sun:{tan:"warm",burn:"cool",mixed:"neutral"} };
  for(const q in map) votes[map[q][a[q]]] += 1;
  if(w.faceSample) votes[w.faceSample.undertone] += 2;
  let undertone = "neutral", mx = -1;
  for(const k of ["warm","cool","neutral"]) if(votes[k]>mx){ mx=votes[k]; undertone=k; }
  if(votes.warm===votes.cool && votes.warm>=votes.neutral) undertone = "neutral";
  const depth = w.faceSample ? w.faceSample.depth : (HAIR_DEPTH[a.hair]||"medium");
  const light = depth==="fair"||depth==="light";
  const deep = depth==="medium-deep"||depth==="deep";
  let season;
  if(undertone==="warm") season = light?"warm spring": deep?"deep autumn":"warm autumn";
  else if(undertone==="cool") season = light?"light summer": deep?"cool winter":"cool summer";
  else season = deep?"soft autumn":"soft summer";
  const bodyType = a.frame==="shoulders"?"inverted triangle": a.frame==="hips"?"pear": a.waist==="defined"?"hourglass":"rectangle";
  const jewelry = a.jewelry==="gold"?"gold": a.jewelry==="silver"?"silver":"both";
  const confidence = w.faceSample?"medium-high":"medium-low";
  return { undertone, depth, season, bodyType, jewelry, confidence, palette: PALETTES[season] };
}
function wizApply(){
  const r = (state.wiz && state.wiz.result) || wizCompute();
  Object.assign(db.profile, {
    undertone:r.undertone, depth:r.depth, season:cap(r.season), bodyType:r.bodyType, jewelry:r.jewelry,
    bestColors: r.palette.best.map(c=>({name:c[0], hex:c[1]})),

  });
  if(state.wiz && state.wiz.faceSample) db.profile.skinHex = state.wiz.faceSample.hex;
  if(state.wiz && state.wiz.answers && state.wiz.answers.hair) db.profile.hair = state.wiz.answers.hair;

  db.onboarded = true;
  save(); state.wiz = null; closeModal(); state.view = first ? "dashboard" : "profile"; render();
}

function chatLocal(q){
  const ql = q.toLowerCase();
  const item = db.garments.find(g=>{
    const last = g.name.toLowerCase().split(" ").pop();
    return ql.includes(last) && (ql.includes(g.colors[0].name.toLowerCase()) || ql.includes(g.name.toLowerCase()));
  });
  if(/why/.test(ql) && item){
    const fitW = Math.abs(item.warmth - targetWarmth(state.temp)) > 2;
    const fitO = item.occasions.includes(state.occ);
    return `${item.name}: occasions ${item.occasions.join("/")}, warmth ${item.warmth}/5, formality ${item.formality}/5. For "${state.occ}" at ${state.temp}°C it ${fitW?"gets filtered out on warmth":!fitO?"doesn't carry that occasion tag":"is in the running — it just scored below the picks (favorites, palette fit and wear history all weigh in)"}.`;
  }
  const occ = OCCS.find(o=>ql.includes(o)) || (/wedding|gala|interview|funeral/.test(ql)?"formal":null);
  if(occ){
    const {combos} = buildCombos(occ, state.temp, state.rain, null, "all");
    if(combos.length){
      return `For ${occ} at ~${state.temp}°C I'd reach for: ${combos[0].items.map(g=>g.name).join(" + ")}. Open Dress me for alternatives with reasoning.`;
    }
    return `Nothing in the wardrobe cleanly fits ${occ} at ${state.temp}°C — that's a gap worth filling.`;
  }
  return "In local mode I can answer “why not <item>” and quick occasion picks. Connect your Claude key under Profile for full conversations.";
}

const HAIR_COLOR = {black:"#241F1B","dark brown":"#3B2A1E",brown:"#5A3E28","light brown":"#7B5836",blonde:"#C9A35F",red:"#8C3B22",grey:"#8E8A84"};
function skinHexFor(){
  if(db.profile.skinHex) return db.profile.skinHex;
  const base = {fair:"#F3DAC6", light:"#E9C6A6", medium:"#C98F66", "medium-deep":"#9C6B47", deep:"#6E4630"}[db.profile.depth] || "#C98F66";
  let [r,g,b] = hex2rgb(base);
  if(db.profile.undertone==="warm"){ r=Math.min(255,r+8); b=Math.max(0,b-6); }
  else if(db.profile.undertone==="cool"){ b=Math.min(255,b+8); r=Math.max(0,r-4); }
  else if(db.profile.undertone==="olive"){ g=Math.min(255,g+7); }
  return rgb2hex(r,g,b);
}
function makeFill(g, pid){
  const c0 = g.colors[0] ? g.colors[0].hex : "#999";
  const c1 = g.colors[1] ? g.colors[1].hex : c0;
  let fill = c0, defs = "";
  if(g.pattern==="stripe" && g.colors[1]){

    fill = `url(#${pid})`;
  } else if(g.pattern==="texture"){
    defs = `<pattern id="${pid}" width="7" height="5" patternUnits="userSpaceOnUse"><rect width="7" height="5" fill="${c0}"/><path d="M0 2.5 Q1.75 1 3.5 2.5 Q5.25 4 7 2.5" stroke="${tintHex(c0,.14)}" stroke-width="1.3" fill="none"/></pattern>`;
    fill = `url(#${pid})`;
  } else if(g.pattern==="floral"){
    defs = `<pattern id="${pid}" width="15" height="15" patternUnits="userSpaceOnUse"><rect width="15" height="15" fill="${c0}"/><circle cx="4" cy="4" r="2" fill="${c1}"/><circle cx="11.5" cy="10.5" r="1.4" fill="${c1}"/></pattern>`;

  }

}

const MOMENT_RULES = [
  {re:/black.?tie|gala|tuxedo|ball\b/i, label:"Black-tie evening", occ:"formal", time:"evening", formalMin:5, amen:["formal shoes + care kit"]},
  {re:/wedding|ceremony/i, label:"Ceremony", occ:"formal", time:"afternoon"},
  {re:/cocktail/i, label:"Cocktail hour", occ:"formal", time:"evening"},
  {re:/conference|meeting|client|office|presentation|summit/i, label:"Business hours", occ:"work", time:"day"},
  {re:/dinner|restaurant|reception/i, label:"Dinner", occ:"date", time:"evening"},
  {re:/party|night ?out|club\b|until late/i, label:"Night out", occ:"date", time:"night"},
  {re:/beach|pool|swim/i, label:"Beach / pool", occ:"casual", time:"day", amen:["swimwear","beach towel","sunscreen","sunglasses"]},
  {re:/hik(e|ing)|trail|trek|viewpoint/i, label:"Hike", occ:"sport", time:"day", amen:["water bottle"]},
  {re:/gym|run\b|running|workout|yoga/i, label:"Workout", occ:"sport", time:"morning"},
  {re:/sightsee|museum|old town|city walk|explor|market/i, label:"Sightseeing", occ:"travel", time:"day", amen:["day bag"]},
  {re:/flight|fly\b|airport|train\b/i, label:"Travel leg", occ:"travel", time:"day", amen:["passport / ID","travel adapter","power bank"]},
  {re:/brunch|breakfast/i, label:"Brunch", occ:"casual", time:"morning"},
];
const TIME_ORDER = {morning:0, day:1, afternoon:2, evening:3, night:4};
const tempFor = (base,time) => time==="morning"?base-3 : time==="evening"?base-5 : time==="night"?base-7 : base;

function parseMoments(text, dayCount){
  if(!text) return [];
  const moments = [];
  text.split(/[.;\n]+/).map(s=>s.trim()).filter(Boolean).forEach(sen=>{
    let day = null;
    const dm = sen.match(/day\s*(\d+)/i);
    if(dm) day = Math.min(dayCount, Math.max(1, +dm[1]));
    MOMENT_RULES.forEach(r=>{
      if(r.re.test(sen)) moments.push({label:r.label, occ:r.occ, time:r.time, formalMin:r.formalMin||0, amen:r.amen||[], day});
    });
  });
  let next = 1;
  moments.forEach(m=>{ if(!m.day){ m.day = ((next-1)%dayCount)+1; next++; } });
  return moments;
}

async function buildPlan(evId){
  const ev = db.events.find(e=>e.id===evId); if(!ev) return;

  while(d<=end && days.length<10){ days.push(isoOf(d)); d = new Date(d.getTime()+86400000); }
  openModal(`<h2>Planning&hellip;</h2><div class="empty">${aiKey()?"Claude is reading your itinerary and dressing every moment.":"Building the plan from your description."}</div>`);

  if(aiKey()){

async function buildPlanAI(ev, days, temp, rain, perDay){
  const wx = days.map(d=>({date:d, high: perDay&&perDay[d]?perDay[d].temp:temp, rain: perDay&&perDay[d]?perDay[d].rain:rain}));
  const prompt = `EVENT: ${JSON.stringify({title:ev.title, type:ev.type, location:ev.location, dress_code:ev.dressCode, description:ev.notes, days:wx})}
WARDROBE CATALOG: ${catalogJson()}
PROFILE: ${profileBrief()}
Plan every moment of this ${days.length>1?"trip":"event"}: day activities, evenings (respect dress codes), nights including sleep/lounge, using ONLY catalog ids. Maximize re-wear across days. If a moment has no suitable item, set items empty and explain in "gap". Reply ONLY JSON:
{"days":[{"date":"YYYY-MM-DD","segments":[{"label":"...","time":"morning|day|afternoon|evening|night","item_ids":["..."],"reason":"weather + location + the user's coloring/style","gap":null}]}],"packing":["ids"],"amenities":["swimwear","sunscreen","travel adapter"]}`;
  const text = await claude([{role:"user", content:prompt}], {maxTokens:3000, system:"You are a personal stylist and travel packer. Reply only with JSON."});
  const data = extractJson(text);
  const valid = id => db.garments.some(g=>g.id===id);
  const daysOut = (data.days||[]).map(p=>({ date:p.date, segs:(p.segments||[]).map(s=>({
    label:s.label||"Moment", time: TIME_ORDER[s.time]!=null? s.time : "day",
    items:(s.item_ids||[]).filter(valid), reason:s.reason||"", gap:s.gap||null })) }));
  if(!daysOut.length || !daysOut.some(p=>p.segs.length)) throw new Error("empty plan");
  const packing = [...new Set([...(data.packing||[]).filter(valid), ...daysOut.flatMap(p=>p.segs.flatMap(s=>s.items))])];
  db.trips[ev.id] = {v:2, temp, rain, packing, amenities:(data.amenities||[]).map(String).slice(0,16), days:daysOut, ai:true};
  save();
}
function buildPlanLocal(ev, days, temp, rain, perDay){
  const baseOcc = ev.type==="formal"?"formal": ev.type==="work"?"work": ev.type==="sport"?"sport": ev.type==="date"?"date": ev.end?"travel":"casual";
  const moments = parseMoments(ev.notes||"", days.length);
  const lounge = db.garments.filter(g=>g.status==="active" && g.occasions.includes("lounge")).slice(0,2);
  const packed = new Set(); const plannedDays = []; let prevAnchor = null;
  const anchorOf = items => { const a = items.find(g=>g.cat==="top"||g.cat==="dress"); return a ? a.id : null; };
  days.forEach((date,di)=>{
    const dayTemp = perDay && perDay[date] ? perDay[date].temp : temp;
    const dayRain = perDay && perDay[date] ? perDay[date].rain : rain;
    const segsRaw = moments.filter(m=>m.day===di+1).map(m=>({label:m.label, time:m.time, occ:m.occ, formalMin:m.formalMin}));
    if(!segsRaw.some(s=>TIME_ORDER[s.time]<=2))
      segsRaw.unshift({label: ev.end?"Daytime":"The event", time:"day", occ:baseOcc, formalMin:0});
    segsRaw.sort((a,b)=>TIME_ORDER[a.time]-TIME_ORDER[b.time]);
    const segs = segsRaw.map(seg=>{
      const t = tempFor(dayTemp, seg.time);
      const {combos} = buildCombos(seg.occ, t, dayRain, packed);
      const floor = (ev.dressCode && seg.occ!=="sport") ? 3 : 0;
      const meetsFloor = c => Math.min(...c.items.map(i=>i.formality)) >= floor;
      const pick = combos.find(c=>anchorOf(c.items)!==prevAnchor && meetsFloor(c))
        || combos.find(meetsFloor) || combos.find(c=>anchorOf(c.items)!==prevAnchor) || combos[0];
      if(!pick) return {label:seg.label, time:seg.time, items:[], reason:"",
        gap:`nothing in your wardrobe fits this — a gap to fill`};
      let gap = null;
      if(seg.formalMin>=5 && Math.min(...pick.items.map(i=>i.formality))<4)
        gap = "nothing true black-tie — closest match shown";
      prevAnchor = anchorOf(pick.items);
      pick.items.forEach(g=>packed.add(g.id));
      const reason = `${seg.time==="day"?"Daytime":cap(seg.time)}, ~${t}&deg;${ev.location?` in ${esc(ev.location)}`:""}${perDay&&perDay[date]?" (live forecast)":""}. `
        + buildReason(pick.items, seg.occ, t, targetWarmth(t), dayRain);
      return {label:seg.label, time:seg.time, items:pick.items.map(g=>g.id), reason, gap};
    });
    if(ev.end) segs.push({label:"Night in", time:"night", items:lounge.map(g=>g.id),
      reason: lounge.length? "Wind-down comfort back at the hotel." : "", gap: lounge.length? null : "pack sleepwear"});
    plannedDays.push({date, segs});
  });
  lounge.forEach(g=>packed.add(g.id));
  const amen = new Set(["toiletries kit","phone & chargers"]);
  moments.forEach(m=>m.amen.forEach(a=>amen.add(a)));
  if(rain) amen.add("compact umbrella");
  if(temp>=23){ amen.add("sunscreen"); amen.add("sunglasses"); }
  if(temp<=5) amen.add("gloves & scarf");
  if(days.length>=4) amen.add("laundry bag");
  if(ev.end && !lounge.length) amen.add("sleepwear");
  db.trips[ev.id] = {v:2, temp, rain, packing:[...packed], amenities:[...amen], days:plannedDays};
  save();
}
function tripResultModal(evId){
  const ev = db.events.find(e=>e.id===evId), t = db.trips[evId]; if(!ev || !t) return;
  if(!t.v){ tripModal(evId); return; }
  const packing = t.packing.map(id=>db.garments.find(g=>g.id===id)).filter(Boolean);
  openModal(`<h2>AI plan <button class="ghost" data-act="close">&times;</button></h2>
  <div class="mini" style="margin:6px 0 12px">${esc(ev.title)}${ev.location?` &middot; ${esc(ev.location)}`:""} &middot; ${t.days.length} day${t.days.length===1?"":"s"} &middot; ~${t.temp}&deg;C${t.rain?", rain expected":""} &middot; <b>${packing.length} pieces</b></div>
  ${t.days.map(p=>`
    <div style="margin-bottom:6px">
      <h3 style="margin:10px 0 2px">${fmtDate(p.date)}</h3>
      ${p.segs.map(s=>`
        <div style="border-top:1px solid var(--line);padding:8px 0">
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
            <span class="chip">${s.time}</span><b style="font-size:13.5px">${esc(s.label)}</b>
            ${s.gap?`<span class="chip" style="color:var(--bad)">${esc(s.gap)}</span>`:""}
          </div>
          ${s.items.length?`<div class="opt-items" style="margin:8px 0 0">${s.items.map(id=>{const g=db.garments.find(x=>x.id===id); return g?tile(g,g.cat):"";}).join("")}</div>`:""}
          ${s.reason?`<div class="reason" style="margin:8px 0 0">${s.reason}</div>`:""}
        </div>`).join("")}
    </div>`).join("")}
  <div class="mini" style="margin:14px 0 4px">Packing list</div>
  <div class="opt-items">${packing.map(g=>tile(g,g.cat)).join("")}</div>
  <div class="mini" style="margin:12px 0 4px">Don't forget</div>
  <div class="pal">${t.amenities.map(a=>`<span class="chip">${esc(a)}</span>`).join("")}</div>
  <div class="note" style="margin-top:14px">Prototype: keyword rules parse your description on-device. In production Claude reads it whole &mdash; every moment, dress code and amenity &mdash; against the real per-day forecast${ev.location?` for ${esc(ev.location)}`:""}, your palette and your learned style.</div>
  <div style="margin-top:14px"><button class="ghost" data-act="plan-trip" data-id="${ev.id}">Rebuild</button></div>`);
}

/* ---------- render & events ---------- */
const main = document.getElementById("main");
const views = {dashboard:viewDashboard, wardrobe:viewWardrobe, dress:viewDress, fit:viewFit, calendar:viewCalendar, events:viewEvents, profile:viewProfile};
function render(){
  document.querySelectorAll(".nav-btn").forEach(b=>b.classList.toggle("active", b.dataset.v===state.view));
  main.innerHTML = views[state.view]();
}

document.addEventListener("click", async e=>{
  const el = e.target.closest("[data-act]"); if(!el) return;
  const act = el.dataset.act, id = el.dataset.id, i = +el.dataset.i;
  switch(act){
    case "nav": state.view = el.dataset.v; render(); break;
    case "close": closeModal(); break;
    case "filter": state.filter = id; render(); break;
    case "filter-stored": state.view = "wardrobe"; state.filter = "stored"; render(); break;
    case "add-garment": document.getElementById("filePick").click(); break;
    case "add-manual": addGarmentModal(); break;
    case "review-save": saveReview(); break;
    case "review-skip": nextReview(); break;
    case "mode-single": startQueue("single"); break;
    case "mode-outfit": startQueue("outfit"); break;
    case "wiz-start": startWizard(); break;
    case "wiz-face": document.getElementById("facePick").click(); break;
    case "wiz-body": document.getElementById("bodyPick").click(); break;
    case "wiz-next": wizNext(); break;
    case "wiz-back": if(state.wiz){ state.wiz.step = Math.max(1, state.wiz.step-1); wizRender(); } break;
    case "wiz-apply": wizApply(); break;
    case "onboard-skip": db.onboarded = true; save(); closeModal(); break;
    case "mock-ai": mockAI(); break;
    case "save-garment": saveGarment(); break;
    case "open-garment": garmentDetail(id); break;
    case "fav-toggle": { const g = db.garments.find(x=>x.id===id); g.fav=!g.fav; save(); garmentDetail(id); render(); break; }
    case "worn-plus": { const g = db.garments.find(x=>x.id===id); g.worn=(g.worn||0)+1; save(); garmentDetail(id); render(); break; }
    case "retire": { const g = db.garments.find(x=>x.id===id); g.status="retired"; save(); closeModal(); render(); break; }
    case "del-garment": { db.garments = db.garments.filter(x=>x.id!==id); save(); closeModal(); render(); break; }
    case "generate": readDressInputs(); state.generating=true; render(); await generate(); state.generating=false; render(); break;
    case "opt-save": {
      const o = state.options[i]; if(!o) break;
      db.outfits.push({id:"o"+uid(), title:o.title.replace(/ — option \d+$/,""), items:o.items, occ:o.occ, temp:o.temp,
        hash:o.hash, date:new Date().toISOString().slice(0,10), wornCount:0});
      o.items.forEach(gid=>{ const g=db.garments.find(x=>x.id===gid); if(g) g.score=(g.score||0)+1; });
      updatePairs(o.items, 1);
      state.options.splice(i,1); save(); render(); break; }
    case "opt-wear": {
      const o = state.options[i]; if(!o) break;
      const today = isoOf(new Date());
      const savedLook = {id:"o"+uid(), title:o.title.replace(/ — option \d+$/,""), items:o.items, occ:o.occ, temp:o.temp,
        hash:o.hash, date:today, wornCount:1};
      db.outfits.push(savedLook);
      db.wearLog = db.wearLog.filter(l=>l.date!==today);
      db.wearLog.push({date:today, outfitId:savedLook.id, items:o.items.slice(), title:savedLook.title});
      o.items.forEach(gid=>{ const g=db.garments.find(x=>x.id===gid); if(g){ g.worn=(g.worn||0)+1; g.lastWorn=today; g.score=(g.score||0)+1; } });
      updatePairs(o.items, 1);
      state.options.splice(i,1); save(); render(); break; }
    case "opt-reject": {
      const o = state.options[i]; if(!o) break;
      db.rejected.push(o.hash);
      o.items.forEach(gid=>{ const g=db.garments.find(x=>x.id===gid); if(g) g.score=(g.score||0)-0.5; });
      updatePairs(o.items, -1);
      state.options.splice(i,1); save(); render(); break; }
    case "today-wear": {
      const pick = todaysPick(); if(!pick) break;
      const today = isoOf(new Date());
      const ids = pick.items.map(g=>g.id);
      const savedLook = {id:"o"+uid(), title:`${cap(pick.occ)} — today's pick`, items:ids, occ:pick.occ, temp:state.temp,
        hash:comboHash(pick.items), date:today, wornCount:1};
      db.outfits.push(savedLook);
      db.wearLog = db.wearLog.filter(l=>l.date!==today);
      db.wearLog.push({date:today, outfitId:savedLook.id, items:ids, title:savedLook.title});
      pick.items.forEach(g=>{ g.worn=(g.worn||0)+1; g.lastWorn=today; g.score=(g.score||0)+1; });
      updatePairs(ids, 1); save(); render(); break; }
    case "share-outfit": shareOutfit((el.dataset.ids||"").split(","), el.dataset.title||"My look"); break;
    case "preset-save": {
      const name = prompt("Preset name (e.g. Office default):"); if(!name) break;
      readDressInputs();
      db.presets.push({name:name.trim().slice(0,24), occ:state.occ, temp:state.temp, rain:state.rain});
      save(); render(); break; }
    case "preset-apply": { const p = db.presets[i]; if(!p) break;
      Object.assign(state, {occ:p.occ, temp:p.temp, rain:p.rain}); render(); break; }
    case "preset-del": db.presets.splice(i,1); save(); render(); break;
    case "chat-open": chatModal(); break;
    case "chat-send": await chatSend(); break;
    case "mirror-check": readDressInputs(); document.getElementById("mirrorPick").click(); break;
    case "weather-enable": enableWeather(); break;
    case "sell-item": listingModal(id); break;
    case "copy-listing": {
      const t = document.getElementById("listingText");
      if(t){ navigator.clipboard.writeText(t.value); el.textContent = "Copied!"; } break; }
    case "store-toggle": {
      const g = db.garments.find(x=>x.id===id); if(!g) break;
      g.status = g.status==="stored" ? "active" : "stored";
      save(); closeModal(); render(); break; }
    case "wish-add": {
      const label = el.dataset.label;
      if(label && !db.wishlist.some(w=>w.label===label)){ db.wishlist.push({label}); save(); render(); } break; }
    case "wish-del": db.wishlist.splice(i,1); save(); render(); break;
    case "wish-got": db.wishlist.splice(i,1); save(); render(); document.getElementById("filePick").click(); break;
    case "import-data": document.getElementById("importPick").click(); break;
    case "load-demo": loadDemo(); break;
    case "fit-cat": state.fitCat = id; render(); break;
    case "fit-wear": {
      const g = db.garments.find(x=>x.id===id); if(!g) break;
      if(db.fit[g.cat]===id) db.fit[g.cat] = null;
      else {
        db.fit[g.cat] = id;
        if(g.cat==="dress"){ db.fit.top = null; db.fit.bottom = null; }
        if(g.cat==="top" || g.cat==="bottom") db.fit.dress = null;
      }
      save(); render(); break; }
    case "fit-clear": db.fit = {}; save(); render(); break;
    case "fit-random": {
      let {combos} = buildCombos("casual", state.temp, state.rain, null, "all");
      if(!combos.length) ({combos} = buildCombos("work", state.temp, state.rain, null, "all"));
      if(!combos.length) break;
      const pick = combos[Math.floor(Math.random()*Math.min(combos.length,6))];
      db.fit = {};
      pick.items.forEach(g=>{ db.fit[g.cat] = g.id; });
      save(); render(); break; }
    case "fit-save": {
      const ids = Object.values(db.fit).filter(Boolean);
      if(ids.length<2) break;
      db.outfits.push({id:"o"+uid(), title:"Dressing room look", items:ids, occ:"styled", temp:state.temp,
        hash:ids.slice().sort().join("|"), date:isoOf(new Date()), wornCount:0});
      updatePairs(ids, 1); save(); render(); break; }
    case "wore-outfit": {
      const o = db.outfits.find(x=>x.id===id); if(!o) break;
      o.wornCount=(o.wornCount||0)+1;
      const today = isoOf(new Date());
      o.items.forEach(gid=>{ const g=db.garments.find(x=>x.id===gid); if(g){ g.worn=(g.worn||0)+1; g.lastWorn=today; } });
      db.wearLog = db.wearLog.filter(l=>l.date!==today);
      db.wearLog.push({date:today, outfitId:o.id, items:o.items.slice(), title:o.title});
      updatePairs(o.items, 0.5);
      save(); render(); break; }
    case "laundry-toggle": {
      const g = db.garments.find(x=>x.id===id); if(!g) break;
      g.status = g.status==="laundry" ? "active" : "laundry";
      save(); closeModal(); render(); break; }
    case "cal-prev": state.calOffset--; render(); break;
    case "cal-next": state.calOffset++; render(); break;
    case "cal-day": dayModal(id); break;
    case "cal-log": {
      const o = db.outfits.find(x=>x.id===id); const date = el.dataset.date;
      if(!o || !date) break;
      db.wearLog = db.wearLog.filter(l=>l.date!==date);
      db.wearLog.push({date, outfitId:o.id, items:o.items.slice(), title:o.title});
      o.wornCount = (o.wornCount||0)+1;
      o.items.forEach(gid=>{ const g=db.garments.find(x=>x.id===gid); if(g){ g.worn=(g.worn||0)+1; if(!g.lastWorn||g.lastWorn<date) g.lastWorn=date; } });
      updatePairs(o.items, 0.5);
      save(); closeModal(); render(); break; }
    case "cal-unlog": {
      const l = db.wearLog.find(x=>x.date===id); if(!l) break;
      l.items.forEach(gid=>{ const g=db.garments.find(x=>x.id===gid); if(g) g.worn=Math.max(0,(g.worn||0)-1); });
      db.wearLog = db.wearLog.filter(x=>x.date!==id);
      save(); closeModal(); render(); break; }
    case "plan-trip": tripModal(id); break;
    case "trip-build": buildPlan(id); break;
    case "trip-view": tripResultModal(id); break;
    case "dismiss-start": db.gettingStartedDismissed = true; save(); render(); break;
    case "export-data": {
      const blob = new Blob([JSON.stringify(db,null,2)], {type:"application/json"});
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = "wodrobe-export.json";
      a.click(); URL.revokeObjectURL(a.href); break; }
    case "wipe-data": {
      if(confirm("Delete all wodrobe data on this device? This cannot be undone.")){
        localStorage.removeItem(LS_KEY); location.reload();
      } break; }
    case "del-outfit": db.outfits = db.outfits.filter(x=>x.id!==id); save(); render(); break;
    case "add-event": {
      const t = document.getElementById("evTitle").value.trim();
      const d = document.getElementById("evDate").value;
      if(!t || !d) break;
      db.events.push({id:"e"+uid(), title:t, type:document.getElementById("evType").value,
        date:d, end:document.getElementById("evEnd").value||null,
        location:document.getElementById("evLoc").value.trim(),
        dressCode:document.getElementById("evCode").value.trim(),
        notes:document.getElementById("evDesc").value.trim()});
      save(); render(); break; }
    case "del-event": db.events = db.events.filter(x=>x.id!==id); save(); render(); break;
    case "plan-event": {
      const ev = db.events.find(x=>x.id===id); if(!ev) break;
      state.occ = ev.type==="formal"?"formal":ev.type==="travel"?"travel":ev.type==="work"?"work":ev.type==="date"?"date":ev.type==="sport"?"sport":"casual";
      state.view="dress"; render();
      readDressInputs(); state.generating=true; render(); await generate(); state.generating=false; render(); break; }
    case "add-pref": {
      const v = document.getElementById("newPref").value.trim();
      if(v){ db.profile.stylePrefs.push(v); save(); render(); } break; }
    case "del-pref": db.profile.stylePrefs.splice(i,1); save(); render(); break;
    case "add-best": {
      const n = document.getElementById("bcName").value.trim();
      if(n){ db.profile.bestColors.push({name:n, hex:document.getElementById("bcHex").value}); save(); render(); } break; }
    case "del-best": db.profile.bestColors.splice(i,1); save(); render(); break;
    case "del-avoid": db.profile.avoidColors.splice(i,1); save(); render(); break;
  }
});
function readDressInputs(){
  const o = document.getElementById("occ"), t = document.getElementById("temp"), r = document.getElementById("rain");
  const s = document.getElementById("dressScope");
  if(o) state.occ = o.value; if(t) state.temp = +t.value; if(r) state.rain = r.checked;
  if(s) state.scope = s.value;
}
document.addEventListener("input", e=>{
  if(e.target.id==="temp"){ const out=document.getElementById("tempOut"); if(out) out.innerHTML = e.target.value+"&deg;C"; }
  if(e.target.id==="tripTemp"){ const out=document.getElementById("tripTempOut"); if(out) out.innerHTML = e.target.value+"&deg;C"; }
  if(e.target.id==="search"){ state.search = e.target.value;
    const list = main.querySelector(".g-items"), empty = main.querySelector(".empty");
    render(); const s = document.getElementById("search"); if(s){ s.focus(); s.setSelectionRange(s.value.length, s.value.length); } }
});
document.addEventListener("change", e=>{
  const bind = e.target.dataset.bind;
  if(bind){ db.profile[bind] = e.target.value; save(); }
  if(e.target.dataset.set){ db.settings[e.target.dataset.set] = e.target.value.trim(); save(); render(); }
  if(e.target.dataset.gfield){
    const g = db.garments.find(x=>x.id===e.target.dataset.gid);
    if(g){ g[e.target.dataset.gfield] = e.target.value; save(); }
  }
  if(e.target.id==="dressScope"){ state.scope = e.target.value; }
});
document.getElementById("importPick").addEventListener("change", ev=>{
  const f = ev.target.files[0]; ev.target.value = ""; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const data = JSON.parse(r.result);
      if(!data || !Array.isArray(data.garments)) throw new Error("not a wodrobe export");
      localStorage.setItem(LS_KEY, JSON.stringify(data));
      location.reload();
    }catch(err){ alert("Import failed: "+err.message); }
  };
  r.readAsText(f);
});
document.getElementById("mirrorPick").addEventListener("change", ev=>{
  const f = ev.target.files[0]; ev.target.value = ""; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>mirrorCheck(r.result);
  r.readAsDataURL(f);
});

render();
if(!db.onboarded) welcomeModal();
if("serviceWorker" in navigator && location.protocol !== "file:"){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
if(db.settings.lat != null){
  fetchWeather().then(()=>{ if(state.view==="dashboard"||state.view==="dress") render(); }).catch(()=>{});
}
</script>
